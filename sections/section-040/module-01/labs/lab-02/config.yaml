apiVersion: astrona.io/v1
metadata:
  name: ats-061-lab-040-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: application-spec
    description: "Application mission builds the production overlay"
    type: file
    source: validation/validate-application-spec.sh
    hint: "Point mission at path kustomize/overlays/prod on main. Argo CD selects Kustomize from the kustomization.yaml file."
  - name: synced-healthy
    description: "Application mission is Synced, Healthy and built by Kustomize"
    type: file
    source: validation/validate-synced-healthy.sh
    hint: "Wait for Synced and Healthy. status.sourceType must be Kustomize."
  - name: prefixed-deployment
    description: "Deployment prod-git-probe has 3 available replicas, the production label and the pinned image"
    type: file
    source: validation/validate-prefixed-deployment.sh
    hint: "The overlay adds the prefix prod-, the label environment=prod, 3 replicas and the tag 3.12-alpine."
  - name: base-not-deployed
    description: "The unprefixed base objects do not exist and the prefixed Service does"
    type: file
    source: validation/validate-base-not-deployed.sh
    hint: "Deploy the overlay, not the base. The Service must be called prod-git-probe."
