apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-fleet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-source.argocd.svc:8080/repo.git
    targetRevision: main
    path: kustomize/overlays/prod
    kustomize:
      patches:
      - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: git-probe
            namespace: starfleet
          spec:
            template:
              spec:
                containers:
                - name: git-probe
                  resources:
                    requests:
                      cpu: 25m
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
