apiVersion: astrona.io/v1
metadata:
  name: ats-061-capstone-040
  docs:
    prerequisites: docs/prerequisites.md
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
# Applied only by `astrona test`: the reference solution.
testing:
  init:
  - name: reference-solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: fleet-chart-repaired
    description: "fleet-chart renders without error with the production values layered"
    type: file
    source: validation/validate-fleet-chart-repaired.sh
    hint: "Replace the missing values file with values-prod.yaml, set image.tag 3.12-alpine in valuesObject and the parameter replicas 4."
  - name: bridge-dev-live
    description: "bridge-dev builds the dev overlay with the image override and runs live"
    type: file
    source: validation/validate-bridge-dev-live.sh
    hint: "Create the Application bridge-dev for kustomize/overlays/dev with kustomize.images docker.io/library/python:3.12-alpine."
  - name: bridge-prod-live
    description: "bridge-prod builds the prod overlay with two replicas set in the Application"
    type: file
    source: validation/validate-bridge-prod-live.sh
    hint: "Create the Application bridge-prod for kustomize/overlays/prod with kustomize.replicas for git-probe set to 2."
  - name: no-render-errors
    description: "None of the three Applications reports a ComparisonError"
    type: file
    source: validation/validate-no-render-errors.sh
    hint: "Read status.conditions of each Application and repair the source that fails to render."
teardown:
  keepCluster: false
