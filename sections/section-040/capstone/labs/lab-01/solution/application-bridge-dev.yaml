apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bridge-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-source.argocd.svc:8080/repo.git
    targetRevision: main
    path: kustomize/overlays/dev
    kustomize:
      images:
      - docker.io/library/python:3.12-alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
