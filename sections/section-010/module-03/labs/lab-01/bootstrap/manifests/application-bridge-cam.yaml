apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bridge-cam
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-source.argocd.svc:8080/repo.git
    targetRevision: main
    path: broken/bad-image
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
