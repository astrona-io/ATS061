apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-source.argocd.svc:8080/repo.git
    targetRevision: v9.9.9
    path: plain-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
