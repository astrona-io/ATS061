apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-release
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-source.argocd.svc:8080/repo.git
    targetRevision: main
    path: plain
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
