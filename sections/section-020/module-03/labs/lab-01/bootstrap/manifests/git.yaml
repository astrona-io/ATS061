apiVersion: v1
kind: ConfigMap
metadata:
  name: git-archive
  namespace: argocd
binaryData:
  repo.tgz: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: git-code
  namespace: argocd
data:
  app.py: |
    import http.server, tarfile, os
    os.makedirs('/tmp/git', exist_ok=True)
    with tarfile.open('/source/repo.tgz') as archive:
        archive.extractall('/tmp/git', filter='data')
    os.chdir('/tmp/git')
    http.server.ThreadingHTTPServer(('0.0.0.0', 8080), http.server.SimpleHTTPRequestHandler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-source
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-source
  template:
    metadata:
      labels:
        app: git-source
    spec:
      containers:
      - name: git-source
        image: docker.io/library/python:3.13-alpine
        ports:
        - containerPort: 8080
        command:
        - python
        - /code/app.py
        volumeMounts:
        - name: code
          mountPath: /code
        - name: source
          mountPath: /source
      volumes:
      - name: code
        configMap:
          name: git-code
      - name: source
        configMap:
          name: git-archive
---
apiVersion: v1
kind: Service
metadata:
  name: git-source
  namespace: argocd
spec:
  selector:
    app: git-source
  ports:
  - port: 8080
    targetPort: 8080
